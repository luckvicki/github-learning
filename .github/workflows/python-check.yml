name: Python checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r excel-tool/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile excel-tool/app.py

      - name: Run unit tests
        run: python -m unittest discover -s excel-tool/tests -v
